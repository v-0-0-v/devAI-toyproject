# Minimal coturn config for zep-mini-mvp local/dev use.
#
# The shared secret is passed in via --static-auth-secret on the container
# command (see docker-compose.yml), sourced from server/.env, so it is not
# hardcoded here.

listening-port=3478

# Time-limited "REST API" credentials (RFC 5766 / coturn's turn-rest style):
# the app server mints a username/credential pair per client using the same
# shared secret, instead of static long-term users.
lt-cred-mech
use-auth-secret
realm=zep-mini-mvp

# Relay port range for allocated TURN sessions. Keep this mapped in
# docker-compose.yml's `ports:`. Widen it in production for more concurrent
# calls (each active relay needs one port).
min-port=49160
max-port=49200

fingerprint
no-cli
no-multicast-peers

# TLS/DTLS (turns:) disabled for local dev to avoid needing a certificate.
# Enable in production (see README) so credentials aren't sent in the clear.
no-tls
no-dtls
