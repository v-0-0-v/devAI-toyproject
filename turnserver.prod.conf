# Production coturn config. Differs from the dev turnserver.conf in two
# ways: TLS is enabled (turns:) and the relay port range is wider.
#
# --static-auth-secret and the TLS cert/key paths are passed as CLI args by
# docker-compose.prod.yml's coturn entrypoint (built from TURN_SECRET and
# TURN_DOMAIN in server/.env.production), not hardcoded here.

listening-port=3478
tls-listening-port=5349

lt-cred-mech
use-auth-secret
realm=zep-mini-mvp

# Each concurrent call allocation needs one port from this range — widen it
# if you expect many simultaneous near-proximity pairs. Keep it in sync with
# the UDP range opened in your firewall and (if not using host networking)
# docker-compose's `ports:`.
min-port=49152
max-port=49452

fingerprint
no-cli
no-multicast-peers

# Do NOT add --allow-loopback-peers here — that flag disables coturn's
# default protection against relaying into loopback/private networks and
# should only ever be used for local, single-host testing (see README).
