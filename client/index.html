<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZEP Mini MVP</title>
    <style>
      html, body { margin: 0; padding: 0; background: #111827; height: 100%; }
      #app { display: flex; align-items: center; justify-content: center; height: 100%; }
      #login {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #111827; font-family: system-ui, sans-serif; color: white; z-index: 10;
      }
      #login form { display: flex; gap: 8px; flex-direction: column; width: 260px; }
      #login input { padding: 10px 12px; border-radius: 8px; border: none; font-size: 14px; }
      #login button {
        padding: 10px 12px; border-radius: 8px; border: none; background: #3b82f6; color: white;
        font-weight: 600; cursor: pointer; font-size: 14px;
      }
      #login h1 { font-size: 18px; margin-bottom: 4px; }
      #login p { font-size: 12px; color: #9ca3af; margin-top: 0; margin-bottom: 16px; }
      #hint {
        position: fixed; bottom: 12px; left: 0; right: 0; text-align: center;
        color: #9ca3af; font-family: system-ui, sans-serif; font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="login">
      <form id="login-form">
        <h1>ZEP Mini MVP</h1>
        <p>닉네임을 입력하고 방향키/WASD로 이동해보세요.</p>
        <input id="nickname" maxlength="16" placeholder="닉네임" autocomplete="off" required />
        <button type="submit">입장하기</button>
      </form>
    </div>
    <div id="app"></div>
    <div id="hint" hidden>방향키 / WASD로 이동</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
