<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZEP Mini MVP</title>
    <style>
      html, body { margin: 0; padding: 0; background: #111827; height: 100%; }
      #app { display: flex; align-items: center; justify-content: center; height: 100%; }
      #login {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #111827; font-family: system-ui, sans-serif; color: white; z-index: 10;
      }
      #login form { display: flex; gap: 8px; flex-direction: column; width: 260px; }
      #login input { padding: 10px 12px; border-radius: 8px; border: none; font-size: 14px; }
      #login button {
        padding: 10px 12px; border-radius: 8px; border: none; background: #3b82f6; color: white;
        font-weight: 600; cursor: pointer; font-size: 14px;
      }
      #login h1 { font-size: 18px; margin-bottom: 4px; }
      #login p { font-size: 12px; color: #9ca3af; margin-top: 0; margin-bottom: 16px; }
      #avatar-colors { display: flex; gap: 8px; margin-bottom: 4px; }
      #avatar-colors label {
        width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
        border: 2px solid transparent; display: block; box-sizing: border-box;
      }
      #avatar-colors input { position: absolute; opacity: 0; width: 0; height: 0; }
      #avatar-colors input:checked + label { border-color: #fff; }
      #hint {
        position: fixed; bottom: 12px; left: 0; right: 0; text-align: center;
        color: #9ca3af; font-family: system-ui, sans-serif; font-size: 12px;
      }

      #video-bar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 5;
        display: flex; gap: 8px; padding: 10px; overflow-x: auto;
        background: linear-gradient(#000000aa, transparent);
        font-family: system-ui, sans-serif;
      }
      .video-tile {
        position: relative; flex: 0 0 auto; width: 140px; height: 105px;
        background: #1f2937; border-radius: 8px; overflow: hidden;
        border: 2px solid #374151;
      }
      .video-tile video {
        width: 100%; height: 100%; object-fit: cover; display: block;
      }
      .video-tile .video-label {
        position: absolute; left: 4px; bottom: 4px; font-size: 11px; color: #fff;
        background: #00000080; padding: 1px 5px; border-radius: 4px;
      }
      .video-tile .video-controls {
        position: absolute; right: 4px; top: 4px; display: flex; gap: 4px;
      }
      .video-tile .video-controls button {
        width: 22px; height: 22px; border: none; border-radius: 4px; cursor: pointer;
        background: #00000090; color: #fff; font-size: 12px; line-height: 1;
      }
      .video-tile .video-controls button.off { background: #ef4444; }
      .video-tile .video-controls button.active { background: #10b981; }
      .video-tile.no-media {
        display: flex; align-items: center; justify-content: center;
        color: #9ca3af; font-size: 11px; text-align: center; padding: 6px;
      }

      #chat {
        position: fixed; right: 10px; bottom: 10px; z-index: 6;
        width: 260px; max-width: calc(100vw - 20px);
        display: flex; flex-direction: column;
        background: #1f2937cc; border: 1px solid #374151; border-radius: 10px;
        font-family: system-ui, sans-serif; overflow: hidden;
      }
      #chat-log {
        height: 160px; overflow-y: auto; padding: 8px; font-size: 12px; color: #e5e7eb;
      }
      .chat-line { margin-bottom: 4px; word-break: break-word; }
      .chat-line--nearby .chat-tag { color: #34d399; }
      .chat-line--global .chat-tag { color: #60a5fa; }
      .chat-tag { font-weight: 600; margin-right: 2px; }
      .chat-nick { font-weight: 600; color: #f9fafb; }
      .chat-text { color: #d1d5db; }
      #chat-form { display: flex; gap: 4px; padding: 6px; border-top: 1px solid #374151; }
      #chat-scope {
        background: #111827; color: #e5e7eb; border: 1px solid #374151; border-radius: 6px;
        font-size: 11px; padding: 0 4px;
      }
      #chat-input {
        flex: 1; min-width: 0; padding: 6px 8px; border-radius: 6px; border: none; font-size: 12px;
      }
      #chat-form button {
        border: none; border-radius: 6px; background: #3b82f6; color: white; padding: 0 10px;
        font-size: 12px; cursor: pointer;
      }

      #touch-controls {
        display: none;
        position: fixed; left: 16px; bottom: 16px; z-index: 6;
        grid-template-columns: repeat(3, 48px);
        grid-template-rows: repeat(3, 48px);
        gap: 4px;
      }
      #touch-controls button {
        border: none; border-radius: 10px; background: #1f2937aa; color: #fff;
        font-size: 18px; touch-action: none; user-select: none;
      }
      #touch-controls button:active { background: #3b82f6aa; }
      #touch-controls [data-dir="up"] { grid-column: 2; grid-row: 1; }
      #touch-controls [data-dir="left"] { grid-column: 1; grid-row: 2; }
      #touch-controls [data-dir="right"] { grid-column: 3; grid-row: 2; }
      #touch-controls [data-dir="down"] { grid-column: 2; grid-row: 3; }

      /* Only touch/coarse-pointer devices (phones, tablets) get the on-screen
         d-pad; desktop keeps keyboard-only controls. */
      @media (pointer: coarse) {
        #touch-controls { display: grid; }
      }

      #object-overlay {
        position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 7;
        background: #1f2937ee; border: 1px solid #374151; border-radius: 10px;
        font-family: system-ui, sans-serif; color: #e5e7eb; padding: 10px;
        max-width: calc(100vw - 20px);
      }
      #object-overlay-header {
        display: flex; justify-content: space-between; align-items: center;
        font-size: 13px; margin-bottom: 8px; gap: 12px;
      }
      #object-overlay-header .hint { font-size: 11px; color: #9ca3af; }
      #whiteboard-toolbar { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
      .wb-color {
        width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
      }
      .wb-color.active { border-color: #fff; }
      #whiteboard-clear {
        margin-left: auto; border: none; border-radius: 6px; background: #374151; color: #fff;
        font-size: 11px; padding: 4px 8px; cursor: pointer;
      }
      #whiteboard-canvas { background: #111827; border-radius: 6px; display: block; touch-action: none; }
      #youtube-frame { width: 320px; height: 180px; border: 0; border-radius: 6px; display: block; }

      #minigame-panel {
        position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 7;
        background: #1f2937ee; border: 1px solid #374151; border-radius: 10px;
        font-family: system-ui, sans-serif; color: #e5e7eb; padding: 12px;
        width: 220px; text-align: center;
      }
      #minigame-panel h3 { margin: 0 0 6px; font-size: 13px; }
      #minigame-status { font-size: 12px; color: #9ca3af; margin-bottom: 8px; min-height: 16px; }
      #minigame-choices { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; }
      #minigame-choices button {
        border: none; border-radius: 6px; background: #374151; color: #fff; cursor: pointer;
        font-size: 12px; padding: 6px 8px;
      }
      #minigame-choices button:hover { background: #3b82f6; }
      #minigame-result { font-size: 12px; color: #f9fafb; word-break: break-word; }

      #admin-panel {
        position: fixed; top: 10px; left: 10px; z-index: 8;
        background: #1f2937ee; border: 1px solid #ef4444; border-radius: 10px;
        font-family: system-ui, sans-serif; color: #e5e7eb; padding: 10px;
        width: 200px; max-height: 60vh; overflow-y: auto;
      }
      #admin-panel h3 { margin: 0 0 6px; font-size: 12px; color: #f87171; }
      #admin-status { font-size: 11px; color: #9ca3af; margin-bottom: 6px; }
      .admin-row {
        display: flex; justify-content: space-between; align-items: center;
        font-size: 12px; padding: 3px 0; gap: 6px;
      }
      .admin-row button {
        border: none; border-radius: 4px; background: #ef4444; color: #fff; cursor: pointer;
        font-size: 11px; padding: 3px 6px;
      }
      .admin-row button:disabled { background: #6b7280; cursor: default; }
      #admin-panel h4 { margin: 10px 0 4px; font-size: 11px; color: #9ca3af; }
      .admin-report-row {
        border-top: 1px solid #374151; padding: 4px 0; font-size: 11px;
      }
      .admin-report-line { display: flex; justify-content: space-between; gap: 6px; }
      .admin-report-time { color: #6b7280; white-space: nowrap; }
      .admin-report-reason { color: #d1d5db; margin-top: 2px; word-break: break-word; }
      .admin-report-empty { color: #6b7280; font-size: 11px; padding: 4px 0; }
    </style>
  </head>
  <body>
    <div id="login">
      <form id="login-form">
        <h1>ZEP Mini MVP</h1>
        <p>닉네임을 입력하고 방향키/WASD로 이동해보세요. 가까이 있는 사람과는 자동으로 화상채팅이 연결됩니다.</p>
        <input id="nickname" maxlength="16" placeholder="닉네임" autocomplete="off" required />
        <div id="avatar-colors">
          <input type="radio" id="color-0" name="avatar-color" value="15680580" checked />
          <label for="color-0" style="background: #ef4444"></label>
          <input type="radio" id="color-1" name="avatar-color" value="16096779" />
          <label for="color-1" style="background: #f59e0b"></label>
          <input type="radio" id="color-2" name="avatar-color" value="1096065" />
          <label for="color-2" style="background: #10b981"></label>
          <input type="radio" id="color-3" name="avatar-color" value="3900150" />
          <label for="color-3" style="background: #3b82f6"></label>
          <input type="radio" id="color-4" name="avatar-color" value="9133302" />
          <label for="color-4" style="background: #8b5cf6"></label>
          <input type="radio" id="color-5" name="avatar-color" value="15485081" />
          <label for="color-5" style="background: #ec4899"></label>
        </div>
        <button type="submit">입장하기</button>
      </form>
    </div>
    <div id="video-bar"></div>
    <div id="app"></div>
    <div id="chat">
      <div id="chat-log"></div>
      <form id="chat-form">
        <select id="chat-scope">
          <option value="nearby">근처</option>
          <option value="global">전체</option>
        </select>
        <input id="chat-input" maxlength="200" placeholder="메시지 입력..." autocomplete="off" />
        <button type="submit">전송</button>
      </form>
    </div>
    <div id="touch-controls">
      <button type="button" data-dir="up">▲</button>
      <button type="button" data-dir="left">◀</button>
      <button type="button" data-dir="right">▶</button>
      <button type="button" data-dir="down">▼</button>
    </div>
    <div id="object-overlay" hidden>
      <div id="object-overlay-header">
        <span id="object-overlay-title"></span>
        <span class="hint">타일에서 벗어나면 자동으로 닫혀요</span>
      </div>
      <div id="whiteboard-body" hidden>
        <div id="whiteboard-toolbar">
          <button type="button" class="wb-color active" data-color="#f9fafb"></button>
          <button type="button" class="wb-color" data-color="#ef4444"></button>
          <button type="button" class="wb-color" data-color="#3b82f6"></button>
          <button type="button" class="wb-color" data-color="#10b981"></button>
          <button type="button" id="whiteboard-clear">지우기</button>
        </div>
        <canvas id="whiteboard-canvas" width="360" height="240"></canvas>
      </div>
      <div id="youtube-body" hidden>
        <iframe
          id="youtube-frame"
          allow="autoplay; encrypted-media"
          allowfullscreen
          title="같이 보기"
        ></iframe>
      </div>
    </div>
    <div id="minigame-panel" hidden>
      <h3>✂️ 가위바위보</h3>
      <div id="minigame-status"></div>
      <div id="minigame-choices" hidden>
        <button type="button" data-choice="rock">✊ 바위</button>
        <button type="button" data-choice="paper">✋ 보</button>
        <button type="button" data-choice="scissors">✌️ 가위</button>
      </div>
      <div id="minigame-result"></div>
    </div>
    <div id="admin-panel" hidden>
      <h3>🛡️ 관리자 모드</h3>
      <div id="admin-status"></div>
      <div id="admin-player-list"></div>
      <h4>신고 로그</h4>
      <div id="admin-report-list"></div>
    </div>
    <div id="hint" hidden>방향키/WASD 이동 · 숫자 1~6 리액션 · 근처 대화는 자동 화상채팅</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
